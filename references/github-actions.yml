name: Validate and package Skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_skill.py .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release_audit.py --history
      - run: python scripts/package_skill.py --out ../soya-portrait-illustrator-0.4.1.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soya-portrait-illustrator-0.4.1
          path: |
            ../soya-portrait-illustrator-0.4.1.zip
            ../soya-portrait-illustrator-0.4.1.zip.sha256
